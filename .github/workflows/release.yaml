name: Release
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Deploy App Token
        id: app-token
        uses: actions/create-github-app-token@main
        with:
          client-id: ${{ secrets.DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: obu-labs
          repositories: vinaya
          permission-actions: write
      - uses: actions/setup-python@main
        with:
          python-version: '3.12'
      - uses: actions/checkout@main
      - name: Build
        run: |
          wget "https://github.com/obu-labs/pali-vinaya-notes/releases/latest/download/scidmap.json"
          pip install -r requirements.txt
          python bmc.py
      - uses: obu-labs/vinaya-notes-module-releaser@main
        with:
          path: "The BMC"
          metadata_file: metadata.yaml
      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh --repo obu-labs/vinaya workflow run build.yaml
